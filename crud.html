<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Member Manager</title><script src="data.js"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-1: #0f172a;
  --bg-2: #1e293b;
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.12);
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-2: #818cf8;
  --male: #60a5fa;
  --female: #f472b6;
  --danger: #ef4444;
  --success: #22c55e;
}

body {
  font-family: 'Kanit', sans-serif;
  background:
    linear-gradient(135deg, var(--bg-1) 0%, #312e81 50%, var(--bg-2) 100%);
  min-height: 100vh;
  color: var(--text);
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 18px;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.07);
  color: var(--text);
  text-decoration: none;
  font-family: inherit;
  font-size: 14px;
  transition: 0.2s;
  backdrop-filter: blur(10px);
}

.home-btn:hover {
  background: rgba(255,255,255,0.14);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

/* =========================
   HEADER
========================= */

header {
  text-align: center;
  margin-bottom: 36px;
}

.logo {
  font-size: 36px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  font-size: 16px;
}

/* =========================
   STATS
========================= */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.stat-box {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  backdrop-filter: blur(10px);
}

.stat-number {
  font-size: 32px;
  font-weight: 600;
  color: var(--accent);
}

.stat-label {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

/* =========================
   CARD
========================= */

.card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px;
  margin-bottom: 24px;
  backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.card-title {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* =========================
   FORM
========================= */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.form-group {
  margin-bottom: 4px;
}

.form-group.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
}

input:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(56,189,248,0.12);
}

select option {
  background: #1e293b;
  color: #fff;
}

/* =========================
   GENDER
========================= */

.gender-options {
  display: flex;
  gap: 12px;
}

.gender-btn {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  color: var(--muted);
  cursor: pointer;
  transition: 0.2s;
  font-size: 15px;
  font-family: inherit;
}

.gender-btn.active.male {
  background: rgba(96,165,250,0.18);
  border-color: var(--male);
  color: var(--male);
}

.gender-btn.active.female {
  background: rgba(244,114,182,0.18);
  border-color: var(--female);
  color: var(--female);
}

/* =========================
   BUTTONS
========================= */

.btn-group {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.btn {
  flex: 1;
  padding: 15px 24px;
  border-radius: 14px;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.2s;
}

.btn-primary {
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  color: #fff;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(56,189,248,0.3);
}

.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: var(--muted);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.12);
  color: var(--text);
}

.btn-danger {
  background: rgba(239,68,68,0.12);
  color: var(--danger);
  border: 1px solid rgba(239,68,68,0.25);
}

.btn-danger:hover {
  background: rgba(239,68,68,0.22);
}

/* =========================
   MEMBERS
========================= */

.members-list {
  display: grid;
  gap: 12px;
}

.member-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  border-radius: 16px;
  background: rgba(0,0,0,0.18);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: 0.2s;
}

.member-item:hover,
.member-item.active {
  border-color: var(--accent);
  background: rgba(56,189,248,0.08);
}

.member-info {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.member-icon {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.member-icon.male {
  background: rgba(96,165,250,0.18);
  color: var(--male);
}

.member-icon.female {
  background: rgba(244,114,182,0.18);
  color: var(--female);
}

.member-name {
  font-weight: 500;
  font-size: 16px;
}

.member-meta {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.6;
}

.member-actions {
  display: flex;
  gap: 8px;
  margin-left: 12px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.06);
  color: var(--muted);
  cursor: pointer;
  transition: 0.2s;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background: rgba(255,255,255,0.15);
  color: var(--text);
}

.icon-btn.edit:hover {
  color: var(--accent);
}

.icon-btn.delete:hover {
  color: var(--danger);
}

.empty-list {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

/* =========================
   TOAST
========================= */

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 16px 24px;
  border-radius: 16px;
  background: rgba(15,23,42,0.9);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  color: var(--text);
  transform: translateY(120px);
  opacity: 0;
  transition: 0.3s;
  z-index: 1000;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 640px) {

  .app {
    padding: 24px 14px;
  }

  .logo {
    font-size: 28px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: auto;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .stats .stat-box:first-child {
    grid-column: 1 / -1;
  }

  .card {
    padding: 20px;
  }

  .member-item {
    align-items: flex-start;
  }

  .member-actions {
    flex-direction: column;
  }
}
</style></head><body><div class="app">  <!-- HOME -->  <div class="top-bar">
    <a href="index.html" class="home-btn">
      🏠 กลับหน้าหลัก
    </a>
  </div>  <header>
    <div class="logo">👨‍👩‍👧 Family Member Manager</div>
    <div class="subtitle">จัดการข้อมูลสมาชิกในครอบครัว</div>
  </header>  <!-- STATS -->  <div class="stats"><div class="stat-box">
  <div class="stat-number" id="stat-total">0</div>
  <div class="stat-label">สมาชิกทั้งหมด</div>
</div>

<div class="stat-box">
  <div class="stat-number" id="stat-male">0</div>
  <div class="stat-label">ชาย</div>
</div>

<div class="stat-box">
  <div class="stat-number" id="stat-female">0</div>
  <div class="stat-label">หญิง</div>
</div>

  </div>  <!-- FORM -->  <div class="card"><div class="card-title" id="form-title">
  ➕ เพิ่มสมาชิก
</div>

<form id="member-form">

  <div class="form-grid">

    <div class="form-group full">
      <label>ชื่อ</label>
      <input
        type="text"
        id="name"
        placeholder="เช่น เกย"
        required
      />
    </div>

    <div class="form-group">

      <label>เพศ</label>

      <div class="gender-options">

        <button
          type="button"
          class="gender-btn male active"
          data-g="ช"
        >
          ♂ ชาย
        </button>

        <button
          type="button"
          class="gender-btn female"
          data-g="ญ"
        >
          ♀ หญิง
        </button>

      </div>

    </div>

    <!-- SPOUSE -->
    <div class="form-group">

      <label>คู่สมรส</label>

      <select id="spouse" multiple size="4">
      </select>

      <small style="color:var(--muted);font-size:12px;">
        กด Ctrl / Command เพื่อเลือกหลายคน
      </small>

    </div>

    <!-- FATHER -->
    <div class="form-group">

      <label>บิดา</label>

      <select id="father">
        <option value="">-- ไม่มี --</option>
      </select>

    </div>

    <!-- MOTHER -->
    <div class="form-group">

      <label>มารดา</label>

      <select id="mother">
        <option value="">-- ไม่มี --</option>
      </select>

    </div>

  </div>

  <div class="btn-group">

    <button
      type="submit"
      class="btn btn-primary"
      id="save-btn"
    >
      บันทึก
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      id="cancel-btn"
      style="display:none;"
    >
      ยกเลิก
    </button>

    <button
      type="button"
      class="btn btn-danger"
      id="delete-btn"
      style="display:none;"
    >
      ลบ
    </button>

  </div>

</form>

  </div>  <!-- MEMBERS LIST -->  <div class="card"><div class="card-title">
  📋 รายชื่อสมาชิก
</div>

<div
  class="members-list"
  id="members-list"
></div>

  </div></div><div class="toast" id="toast"></div><script>

/* =========================================================
   LOAD DATA
   ใช้ familyRawData จาก data.js โดยตรง
========================================================= */

let people = Array.isArray(window.familyRawData)
  ? window.familyRawData.map(p => ({
      ...p,
      spouse: Array.isArray(p.spouse)
        ? [...p.spouse]
        : [],
      father: p.father || "",
      mother: p.mother || "",
      gender: p.gender || "ช",
      photo: p.photo || ""
    }))
  : [];

let selectedGender = "ช";
let editingId = null;


/* =========================================================
   TOAST
========================================================= */

function showToast(msg) {

  const t = document.getElementById("toast");

  t.textContent = msg;
  t.classList.add("show");

  setTimeout(() => {
    t.classList.remove("show");
  }, 2500);

}


/* =========================================================
   FIND PERSON
========================================================= */

function getPerson(id) {

  if (!id) return null;

  return people.find(
    p => String(p.id) === String(id)
  ) || null;

}


/* =========================================================
   NAME
========================================================= */

function getName(id) {

  const p = getPerson(id);

  return p ? p.name : "";

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

  document.getElementById("stat-total").textContent =
    people.length;

  document.getElementById("stat-male").textContent =
    people.filter(p => p.gender === "ช").length;

  document.getElementById("stat-female").textContent =
    people.filter(p => p.gender === "ญ").length;

}


/* =========================================================
   POPULATE SELECTS
========================================================= */

function populateSelects() {

  const spouse = document.getElementById("spouse");
  const father = document.getElementById("father");
  const mother = document.getElementById("mother");

  const oldSpouse = Array.from(spouse.selectedOptions)
    .map(o => o.value);

  const oldFather = father.value;
  const oldMother = mother.value;

  spouse.innerHTML = "";
  father.innerHTML = '<option value="">-- ไม่มี --</option>';
  mother.innerHTML = '<option value="">-- ไม่มี --</option>';

  people.forEach(p => {

    if (editingId && String(p.id) === String(editingId)) {
      return;
    }

    /* คู่สมรส */

    const spouseOption =
      document.createElement("option");

    spouseOption.value = p.id;
    spouseOption.textContent =
      `${p.name} (${p.gender})`;

    spouse.appendChild(spouseOption);


    /* พ่อ */

    const fatherOption =
      document.createElement("option");

    fatherOption.value = p.id;
    fatherOption.textContent =
      `${p.name} (${p.gender})`;

    father.appendChild(fatherOption);


    /* แม่ */

    const motherOption =
      document.createElement("option");

    motherOption.value = p.id;
    motherOption.textContent =
      `${p.name} (${p.gender})`;

    mother.appendChild(motherOption);

  });


  /* คืนค่าที่เลือกไว้ */

  oldSpouse.forEach(id => {

    const option =
      spouse.querySelector(`option[value="${CSS.escape(id)}"]`);

    if (option) {
      option.selected = true;
    }

  });

  if (oldFather) {
    father.value = oldFather;
  }

  if (oldMother) {
    mother.value = oldMother;
  }

}


/* =========================================================
   RENDER MEMBER LIST
========================================================= */

function renderMembersList() {

  const list =
    document.getElementById("members-list");

  list.innerHTML = "";

  if (people.length === 0) {

    list.innerHTML =
      `<div class="empty-list">
        ยังไม่มีข้อมูลสมาชิก
      </div>`;

    return;
  }


  people.forEach(p => {

    const spouseNames =
      (p.spouse || [])
        .map(id => getName(id))
        .filter(Boolean);

    const meta = [];


    if (spouseNames.length) {

      meta.push(
        "คู่สมรส: " +
        spouseNames.join(", ")
      );

    }


    const parentNames = [];

    if (p.father) {

      const name = getName(p.father);

      if (name) {
        parentNames.push(
          "บิดา: " + name
        );
      }

    }

    if (p.mother) {

      const name = getName(p.mother);

      if (name) {
        parentNames.push(
          "มารดา: " + name
        );
      }

    }


    meta.push(...parentNames);


    const item =
      document.createElement("div");

    item.className =
      "member-item" +
      (editingId &&
       String(editingId) === String(p.id)
        ? " active"
        : "");


    item.innerHTML = `

      <div class="member-info">

        <div class="member-icon ${
          p.gender === "ช"
            ? "male"
            : "female"
        }">

          ${
            p.gender === "ช"
              ? "♂"
              : "♀"
          }

        </div>

        <div>

          <div class="member-name">
            ${escapeHTML(p.name)}
          </div>

          ${
            meta.length
              ? `<div class="member-meta">
                  ${meta.map(escapeHTML).join(" • ")}
                 </div>`
              : ""
          }

        </div>

      </div>


      <div class="member-actions">

        <button
          class="icon-btn edit"
          title="แก้ไข"
          onclick="
            event.stopPropagation();
            editMember('${p.id}');
          "
        >
          ✎
        </button>

        <button
          class="icon-btn delete"
          title="ลบ"
          onclick="
            event.stopPropagation();
            deleteMember('${p.id}');
          "
        >
          🗑
        </button>

      </div>

    `;


    item.onclick =
      () => selectMember(p.id);

    list.appendChild(item);

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   SELECT MEMBER
========================================================= */

function selectMember(id) {

  const p = getPerson(id);

  if (!p) return;

  editingId = String(id);

  document.getElementById("name").value =
    p.name || "";

  setGender(p.gender || "ช");

  document.getElementById("edit-id").value =
    p.id;


  populateSelects();


  /* คู่สมรสหลายคน */

  const spouseSelect =
    document.getElementById("spouse");

  Array.from(spouseSelect.options)
    .forEach(option => {

      option.selected =
        (p.spouse || [])
          .map(String)
          .includes(String(option.value));

    });


  document.getElementById("father").value =
    p.father || "";

  document.getElementById("mother").value =
    p.mother || "";


  document.getElementById("form-title").textContent =
    "✏️ แก้ไขสมาชิก";

  document.getElementById("save-btn").textContent =
    "อัปเดต";

  document.getElementById("cancel-btn").style.display =
    "block";

  document.getElementById("delete-btn").style.display =
    "block";


  renderMembersList();

}


/* =========================================================
   EDIT
========================================================= */

function editMember(id) {

  selectMember(id);

}


/* =========================================================
   DELETE
========================================================= */

function deleteMember(id) {

  const p = getPerson(id);

  if (!p) return;


  if (!confirm(
    `ต้องการลบ "${p.name}" ใช่หรือไม่?`
  )) {
    return;
  }


  people =
    people.filter(
      x => String(x.id) !== String(id)
    );


  /* ลบ ID นี้ออกจากคู่สมรสของคนอื่น */

  people.forEach(x => {

    x.spouse =
      (x.spouse || [])
        .filter(
          spouseId =>
            String(spouseId) !== String(id)
        );

    if (String(x.father) === String(id)) {
      x.father = "";
    }

    if (String(x.mother) === String(id)) {
      x.mother = "";
    }

  });


  if (
    editingId &&
    String(editingId) === String(id)
  ) {
    resetForm();
  }


  refreshAll();

  showToast("ลบสมาชิกแล้ว");

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

  editingId = null;

  document
    .getElementById("member-form")
    .reset();

  setGender("ช");


  document.getElementById("form-title").textContent =
    "➕ เพิ่มสมาชิก";

  document.getElementById("save-btn").textContent =
    "บันทึก";

  document.getElementById("cancel-btn").style.display =
    "none";

  document.getElementById("delete-btn").style.display =
    "none";


  populateSelects();

  renderMembersList();

}


/* =========================================================
   GENDER
========================================================= */

function setGender(g) {

  selectedGender = g;

  document
    .querySelectorAll(".gender-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.g === g
      );

    });

}


/* =========================================================
   REFRESH
========================================================= */

function refreshAll() {

  populateSelects();
  renderMembersList();
  updateStats();

}


/* =========================================================
   GENDER BUTTON
========================================================= */

document
  .querySelectorAll(".gender-btn")
  .forEach(btn => {

    btn.onclick = () => {

      setGender(btn.dataset.g);

    };

  });


/* =========================================================
   FORM SUBMIT
========================================================= */

document
  .getElementById("member-form")
  .onsubmit = function(e) {

    e.preventDefault();


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const spouse =
      Array.from(
        document.getElementById("spouse").selectedOptions
      ).map(option => option.value);


    const father =
      document.getElementById("father").value;


    const mother =
      document.getElementById("mother").value;


    if (!name) {

      alert("กรุณากรอกชื่อ");

      return;

    }


    /* คนเดียวกันเป็นทั้งพ่อและแม่ไม่ได้ */

    if (
      father &&
      mother &&
      father === mother
    ) {

      alert(
        "ไม่สามารถเลือกบิดาและมารดาเป็นคนเดียวกันได้"
      );

      return;

    }


    /* คนเดียวกันเป็นทั้งคู่สมรสและพ่อ/แม่ไม่ได้ */

    if (
      spouse.includes(father) ||
      spouse.includes(mother)
    ) {

      alert(
        "ไม่สามารถเลือกบุคคลเดียวกันเป็นคู่สมรสและบิดา/มารดาได้"
      );

      return;

    }


    /* =====================
       UPDATE
    ===================== */

    if (editingId) {

      const p =
        getPerson(editingId);

      if (!p) return;


      p.name = name;
      p.gender = selectedGender;
      p.spouse = spouse;
      p.father = father;
      p.mother = mother;


      /*
       * อัปเดตความสัมพันธ์คู่สมรส
       */

      people.forEach(other => {

        if (
          String(other.id) ===
          String(p.id)
        ) {
          return;
        }

        other.spouse =
          (other.spouse || [])
            .filter(
              id =>
                !spouse.includes(
                  String(id)
                ) ||
                spouse.includes(
                  String(other.id)
                )
            );

      });


      spouse.forEach(spouseId => {

        const spousePerson =
          getPerson(spouseId);

        if (!spousePerson) return;

        if (!Array.isArray(
          spousePerson.spouse
        )) {
          spousePerson.spouse = [];
        }

        if (
          !spousePerson.spouse
            .map(String)
            .includes(String(p.id))
        ) {

          spousePerson.spouse.push(
            String(p.id)
          );

        }

      });


      showToast("อัปเดตสมาชิกแล้ว");

    }


    /* =====================
       ADD
    ===================== */

    else {

      const newId =
        String(
          Math.max(
            0,
            ...people.map(
              p => Number(p.id) || 0
            )
          ) + 1
        );


      const newPerson = {

        id: newId,

        name: name,

        father: father,

        mother: mother,

        spouse: spouse,

        gender: selectedGender,

        photo: ""

      };


      people.push(newPerson);


      /*
       * เพิ่มความสัมพันธ์คู่สมรส
       */

      spouse.forEach(spouseId => {

        const spousePerson =
          getPerson(spouseId);

        if (!spousePerson) return;

        if (!Array.isArray(
          spousePerson.spouse
        )) {
          spousePerson.spouse = [];
        }

        if (
          !spousePerson.spouse
            .map(String)
            .includes(newId)
        ) {

          spousePerson.spouse.push(
            newId
          );

        }

      });


      showToast("เพิ่มสมาชิกแล้ว");

    }


    resetForm();

    refreshAll();

  };


/* =========================================================
   CANCEL
========================================================= */

document
  .getElementById("cancel-btn")
  .onclick = resetForm;


/* =========================================================
   DELETE FROM FORM
========================================================= */

document
  .getElementById("delete-btn")
  .onclick = function() {

    if (editingId) {

      deleteMember(editingId);

    }

  };


/* =========================================================
   START
========================================================= */

refreshAll();

</script>

</body>
</html>
