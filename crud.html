@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

* {
  box-sizing: border-box;

}

:root {

}

body {

  font-family: 'Kanit', sans-serif;

  color: var(--text);

}

.app {

}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {

  align-items: center;

}

  color: var(--muted);

  font-size: 13px;

}

.status-dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: var(--success);

  box-shadow:
    0 0 10px var(--success);

}

.status-dot.error {

  background: var(--danger);

  box-shadow:
    0 0 10px var(--danger);

}

.home-btn {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  padding: 10px 16px;

  border-radius: 12px;

  border: 1px solid var(--border);

  background:
    rgba(255,255,255,0.07);

  color: var(--text);

  text-decoration: none;

  font-family: inherit;

  font-size: 14px;

  transition: 0.2s;

  backdrop-filter: blur(10px);

}

.home-btn:hover {

  background:
    rgba(255,255,255,0.14);

  border-color:
    var(--accent);

  color:
    var(--accent);

}


/* =========================================================
   HEADER
========================================================= */

header {

}

.logo {

    linear-gradient(

      var(--accent),
      var(--accent-2)
    );

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;

  margin-bottom: 8px;

}

.subtitle {

  color: var(--muted);

  font-size: 16px;

}


/* =========================================================
   STATS
========================================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 16px;

  margin-bottom: 24px;

}

.stat-box {

  background:
    var(--glass);

  border:
    1px solid var(--border);

  border-radius: 20px;

  padding: 20px;

  text-align: center;

  backdrop-filter: blur(10px);

}

.stat-number {

  font-size: 32px;

  font-weight: 600;

  color: var(--accent);

}

.stat-label {

  font-size: 13px;

  color: var(--muted);

  margin-top: 4px;

}


/* =========================================================
   CARD
========================================================= */

.card {

  background:
    var(--glass);

  border:
    1px solid var(--border);

  border-radius: 24px;

  padding: 26px;

  margin-bottom: 22px;

/* =========================================================

.toast {

}

/* =========================================================
   CONFIG
========================================================= */

const API = "/api/family";


/* =========================================================
   STATE
========================================================= */

let people = [];

let selectedGender = "ช";

let editingId = null;


/* =========================================================
   DOM
========================================================= */

const form =
  document.getElementById(
    "member-form"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const spouseSelect =
  document.getElementById(
    "spouse"
  );

const fatherSelect =
  document.getElementById(
    "father"
  );

const motherSelect =
  document.getElementById(
    "mother"
  );

const membersList =
  document.getElementById(
    "members-list"
  );

const searchInput =
  document.getElementById(
    "search"
  );


/* =========================================================
   STATUS
========================================================= */

function setServerStatus(
  online,
  message
) {

  const dot =
    document.getElementById(
      "status-dot"
    );

  const text =
    document.getElementById(
      "status-text"
    );


  dot.classList.toggle(
    "error",
    !online
  );


  text.textContent =
    message;

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(
  message,
  type = "success"
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast show " +
    type;


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

  try {

    setServerStatus(
      true,
      "กำลังโหลดข้อมูล..."
    );


    const response =
      await fetch(
        API,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "โหลดข้อมูลไม่สำเร็จ"
      );

    }


    people =
      Array.isArray(result.data)
        ? result.data.map(
            normalizePerson
          )
        : [];


    setServerStatus(
      true,
      `เชื่อมต่อแล้ว • ${people.length} คน`
    );


    refreshAll();


  } catch (error) {

    console.error(
      "LOAD ERROR:",
      error
    );


    setServerStatus(
      false,
      "เชื่อมต่อ Server ไม่ได้"
    );


    membersList.innerHTML = `

      <div class="empty-list">

        ❌ ไม่สามารถโหลดข้อมูลได้

        <br><br>

        กรุณาตรวจสอบว่าเปิด
        <b>server.js</b>
        อยู่หรือไม่

        <br><br>

        <small>
          http://localhost:3000
        </small>

      </div>

    `;


    showToast(
      "❌ โหลดข้อมูลจาก server ไม่ได้",
      "error"
    );

  }

}


/* =========================================================
   NORMALIZE PERSON
========================================================= */

function normalizePerson(
  person
) {

  return {

    id:
      String(
        person.id ?? ""
      ),

    name:
      String(
        person.name ?? ""
      ),

    father:
      person.father === null ||
      person.father === undefined
        ? ""
        : String(
            person.father
          ),

    mother:
      person.mother === null ||
      person.mother === undefined
        ? ""
        : String(
            person.mother
          ),

    spouse:
      Array.isArray(
        person.spouse
      )
        ? person.spouse.map(
            String
          )
        : [],

    gender:
      person.gender === "ญ"
        ? "ญ"
        : "ช",

    photo:
      person.photo === null ||
      person.photo === undefined
        ? ""
        : String(
            person.photo
          )

  };

}


/* =========================================================
   GET PERSON
========================================================= */

function getPerson(
  id
) {

  return people.find(
    person =>
      String(person.id) ===
      String(id)
  ) || null;

}


/* =========================================================
   GET NAME
========================================================= */

function getName(
  id
) {

  const person =
    getPerson(id);

  return person
    ? person.name
    : "";

}
/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

  document.getElementById(
    "stat-total"
  ).textContent =
    people.length;


  document.getElementById(
    "stat-male"
  ).textContent =
    people.filter(
      p => p.gender === "ช"
    ).length;


  document.getElementById(
    "stat-female"
  ).textContent =
    people.filter(
      p => p.gender === "ญ"
    ).length;

}


/* =========================================================
   POPULATE SELECTS
========================================================= */

function populateSelects() {

  const current =
    editingId
      ? getPerson(
          editingId
        )
      : null;


  const currentSpouses =
    current &&
    Array.isArray(
      current.spouse
    )
      ? current.spouse.map(
          String
        )
      : [];


  const currentFather =
    current
      ? String(
          current.father || ""
        )
      : "";


  const currentMother =
    current
      ? String(
          current.mother || ""
        )
      : "";


  spouseSelect.innerHTML =
    "";


  fatherSelect.innerHTML =
    `
      <option value="">
        -- ไม่มี --
      </option>
    `;


  motherSelect.innerHTML =
    `
      <option value="">
        -- ไม่มี --
      </option>
    `;


  const sorted =
    [...people].sort(
      (a, b) =>
        Number(a.id) -
        Number(b.id)
    );


  sorted.forEach(
    person => {


      /*
        ไม่ให้เลือกตัวเอง
      */

      if (
        editingId &&
        String(person.id) ===
        String(editingId)
      ) {

        return;

      }


      /* -----------------------------------------------
         SPOUSE
      ----------------------------------------------- */

      const spouseOption =
        document.createElement(
          "option"
        );


      spouseOption.value =
        person.id;


      spouseOption.textContent =
        `${person.name} (${person.gender})`;


      spouseOption.selected =
        currentSpouses.includes(
          String(person.id)
        );


      spouseSelect.appendChild(
        spouseOption
      );


      /* -----------------------------------------------
         FATHER
      ----------------------------------------------- */

      const fatherOption =
        document.createElement(
          "option"
        );


      fatherOption.value =
        person.id;


      fatherOption.textContent =
        `${person.name} (${person.gender})`;


      fatherOption.selected =
        currentFather ===
        String(person.id);


      fatherSelect.appendChild(
        fatherOption
      );


      /* -----------------------------------------------
         MOTHER
      ----------------------------------------------- */

      const motherOption =
        document.createElement(
          "option"
        );


      motherOption.value =
        person.id;


      motherOption.textContent =
        `${person.name} (${person.gender})`;


      motherOption.selected =
        currentMother ===
        String(person.id);


      motherSelect.appendChild(
        motherOption
      );

    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   RENDER LIST
========================================================= */

function renderMembersList() {

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const sorted =
    [...people].sort(
      (a, b) =>
        Number(a.id) -
        Number(b.id)
    );


  const filtered =
    sorted.filter(
      person => {

        if (!keyword) {
          return true;
        }


        return (
          person.name
            .toLowerCase()
            .includes(
              keyword
            )
          ||
          String(
            person.id
          ).includes(
            keyword
          )

        );

      }
    );


  membersList.innerHTML =
    "";


  if (
    filtered.length === 0
  ) {

    membersList.innerHTML = `

      <div class="empty-list">

        ${
          people.length === 0
            ? "ยังไม่มีข้อมูลสมาชิก"
            : "ไม่พบสมาชิกที่ค้นหา"
        }

      </div>

    `;

    return;

  }


  filtered.forEach(
    person => {

      const spouseNames =
        (
          person.spouse || []
        )
          .map(
            getName
          )
          .filter(
            Boolean
          );


      const meta = [];


      /*
        คู่สมรส
      */

      if (
        spouseNames.length
      ) {

        meta.push(
          "คู่สมรส: " +
          spouseNames.join(
            ", "
          )
        );

      }


      /*
        พ่อ
      */

      if (
        person.father
      ) {

        const father =
          getName(
            person.father
          );


        if (father) {

          meta.push(
            "บิดา: " +
            father
          );

        }

      }


      /*
        แม่
      */

      if (
        person.mother
      ) {

        const mother =
          getName(
            person.mother
          );


        if (mother) {

          meta.push(
            "มารดา: " +
            mother
          );

        }

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "member-item" +
        (
          editingId &&
          String(
            editingId
          ) ===
          String(
            person.id
          )
            ? " active"
            : ""
        );


      item.innerHTML = `

        <div class="member-info">

          <div class="member-icon ${
            person.gender === "ช"
              ? "male"
              : "female"
          }">

            ${
              person.gender === "ช"
                ? "♂"
                : "♀"
            }

          </div>


          <div>

            <div class="member-name">

              ${escapeHTML(
                person.name
              )}

            </div>


            <div class="member-meta">

              ID: ${escapeHTML(
                person.id
              )}

              ${
                meta.length
                  ? " • " +
                    meta
                      .map(
                        escapeHTML
                      )
                      .join(
                        " • "
                      )
                  : ""
              }

            </div>

          </div>

        </div>


        <div class="member-actions">

          <button
            type="button"
            class="icon-btn edit"
            title="แก้ไข"
          >
            ✎
          </button>


          <button
            type="button"
            class="icon-btn delete"
            title="ลบ"
          >
            🗑
          </button>

        </div>

      `;


      /*
        คลิกรายการ
      */

      item.addEventListener(
        "click",
        () =>
          editMember(
            person.id
          )
      );


      /*
        ปุ่มแก้ไข
      */

      item
        .querySelector(
          ".edit"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            editMember(
              person.id
            );

          }
        );


      /*
        ปุ่มลบ
      */

      item
        .querySelector(
          ".delete"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            deleteMember(
              person.id
            );

          }
        );


      membersList.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   EDIT MEMBER
========================================================= */

function editMember(
  id
) {

  const person =
    getPerson(id);


  if (!person) {
    return;
  }


  editingId =
    String(id);


  nameInput.value =
    person.name || "";


  setGender(
    person.gender || "ช"
  );


  populateSelects();


  /*
    ตั้งค่าคู่สมรส
  */

  const spouseIds =
    (
      person.spouse || []
    ).map(
      String
    );


  Array.from(
    spouseSelect.options
  ).forEach(
    option => {

      option.selected =
        spouseIds.includes(
          String(
            option.value
          )
        );

    }
  );


  fatherSelect.value =
    person.father || "";


  motherSelect.value =
    person.mother || "";


  document.getElementById(
    "form-title"
  ).textContent =
    "✏️ แก้ไขสมาชิก";


  document.getElementById(
    "save-btn"
  ).textContent =
    "อัปเดตข้อมูล";


  document.getElementById(
    "cancel-btn"
  ).style.display =
    "block";


  document.getElementById(
    "delete-btn"
  ).style.display =
    "block";


  renderMembersList();


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================================================
   SAVE
========================================================= */

async function saveMember() {

  const name =
    nameInput.value.trim();


  if (!name) {

    showToast(
      "⚠️ กรุณากรอกชื่อ",
      "error"
    );

    nameInput.focus();

    return;

  }


  const spouse =
    Array.from(
      spouseSelect.selectedOptions
    )
      .map(
        option =>
          String(
            option.value
          )
      );


  const father =
    String(
      fatherSelect.value || ""
    );


  const mother =
    String(
      motherSelect.value || ""
    );


  /*
    ตรวจพ่อแม่คนเดียวกัน
  */

  if (
    father &&
    mother &&
    father === mother
  ) {

    showToast(
      "⚠️ บิดาและมารดาต้องเป็นคนละคน",
      "error"
    );

    return;

  }


  const person = {

    name:
      name,

    gender:
      selectedGender,

    father:
      father,

    mother:
      mother,

    spouse:
      spouse,

    photo:
      editingId
        ? (
            getPerson(
              editingId
            )?.photo || ""
          )
        : ""

  };


  const saveButton =
    document.getElementById(
      "save-btn"
    );


  saveButton.disabled =
    true;


  try {

    let response;


    /*
      EDIT
    */

    if (editingId) {

      response =
        await fetch(
          `${API}/${encodeURIComponent(
            editingId
          )}`,
          {

            method: "PUT",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                person
              )

          }
        );

    }


    /*
      ADD
    */

    else {

      response =
        await fetch(
          API,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                person
              )

          }
        );

    }


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "บันทึกข้อมูลไม่สำเร็จ"
      );

    }


    if (editingId) {

      showToast(
        "✅ อัปเดตข้อมูลลง data.js แล้ว"
      );

    } else {

      showToast(
        "✅ เพิ่มสมาชิกลง data.js แล้ว"
      );

    }


    /*
      โหลดข้อมูลใหม่จาก server
    */

    await loadData();


    /*
      ล้างฟอร์ม
    */

    resetForm(
      false
    );


  } catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    showToast(
      "❌ " +
      error.message,
      "error"
    );


  } finally {

    saveButton.disabled =
      false;

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMember(
  id
) {

  const person =
    getPerson(id);


  if (!person) {
    return;
  }


  const confirmed =
    confirm(
      `ต้องการลบ "${person.name}" ใช่หรือไม่?\n\n` +
      `ID: ${person.id}\n\n` +
      `ความสัมพันธ์กับสมาชิกคนอื่นจะถูกปรับด้วย`
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/${encodeURIComponent(
          id
        )}`,
        {
          method: "DELETE"
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "ลบข้อมูลไม่สำเร็จ"
      );

    }


    showToast(
      "✅ ลบสมาชิกและบันทึก data.js แล้ว"
    );


    editingId =
      null;


    await loadData();


    resetForm(
      false
    );


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    showToast(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm(
  showMessage = true
) {

  editingId =
    null;


  form.reset();


  setGender(
    "ช"
  );


  document.getElementById(
    "form-title"
  ).textContent =
    "➕ เพิ่มสมาชิก";


  document.getElementById(
    "save-btn"
  ).textContent =
    "บันทึก";


  document.getElementById(
    "cancel-btn"
  ).style.display =
    "none";


  document.getElementById(
    "delete-btn"
  ).style.display =
    "none";


  populateSelects();


  renderMembersList();


  if (showMessage) {

    showToast(
      "ยกเลิกการแก้ไข"
    );

  }

}


/* =========================================================
   GENDER
========================================================= */

function setGender(
  gender
) {

  selectedGender =
    gender === "ญ"
      ? "ญ"
      : "ช";


  document
    .querySelectorAll(
      ".gender-btn"
    )
    .forEach(
      button => {

        const active =
          button.dataset.g ===
          selectedGender;


        button.classList.toggle(
          "active",
          active
        );

      }
    );

}


/* =========================================================
   GENDER BUTTONS
========================================================= */

document
  .querySelectorAll(
    ".gender-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setGender(
            button.dataset.g
          );

        }
      );

    }
  );


/* =========================================================
   FORM SUBMIT
========================================================= */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    saveMember();

  }
);


/* =========================================================
   CANCEL
========================================================= */

document
  .getElementById(
    "cancel-btn"
  )
  .addEventListener(
    "click",
    () => {

      resetForm();

    }
  );


/* =========================================================
   DELETE BUTTON
========================================================= */

document
  .getElementById(
    "delete-btn"
  )
  .addEventListener(
    "click",
    () => {

      if (editingId) {

        deleteMember(
          editingId
        );

      }

    }
  );


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    renderMembersList();

  }
);


/* =========================================================
   START
========================================================= */

loadData();

</script>
